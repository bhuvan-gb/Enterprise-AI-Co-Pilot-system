{% extends 'base.html' %}{% block title %}Forgot password{% endblock %}
{% block auth %}<div class="auth-shell">{% include 'auth/_side.html' %}
<section class="auth-main"><div class="auth-card">
  <h2 class="mb-1">Reset your password</h2><p class="text-muted mb-4">Enter your work email and we will send a reset link that is valid for 30 minutes.</p>
  <form method="post" novalidate>{{ form.hidden_tag() }}
    <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required autofocus></div>
    <button class="btn btn-primary w-100" type="submit">Send reset link</button></form>
  <p class="text-center mt-4 mb-0"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
</div></section></div>{% endblock %}
